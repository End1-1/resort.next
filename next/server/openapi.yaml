openapi: 3.0.3
info:
  title: Hotel API
  version: 0.7.0
  description: |
    Qt/C++ service in next/server (Qt 6.10 target; the same sources also build
    on Qt 6.4). The engine choice overrides docs/audit/03 §3.2 (that note suggested Go).
    The store is the nx_ tables in next/dbdump/migrations/0002_nx_core.sql, not
    f_reservation / m_register. See next/docs/nx-schema.md.

    POST /api/v1/sessions reads nx_user. password_scheme must be md5. The service
    hashes the UTF-8 password with MD5 (32 lowercase hex) and compares it to
    password_hash. It does not send the password to MariaDB, does not read the
    legacy users table, and does not rewrite the hash. Apply 0002_nx_core.sql
    before login. Seed a user from next/dbdump/seed/nx_user.example.sql. The
    process does not create the tables itself.

    A successful login inserts nx_session. The response token is 64 hex
    characters. The database stores SHA-256 of that token, not the token. The
    row expires after 12 hours (UTC). commands_allowed is false when role_id is
    null or nx_role_permission has no row for that role. Login still succeeds.
    user.group repeats user.role_id.

    Every /api/v1 route except POST /api/v1/sessions requires
    Authorization: Bearer <token>. The token is hashed with SHA-256 and looked
    up in nx_session. Missing, malformed, unknown, and revoked tokens are 401
    unauthorized. An expired row is 401 session_expired. A user whose state is
    not active is 401 user_disabled. GET /health stays open. Mutating routes
    (POST, PUT, PATCH, DELETE), other than DELETE /api/v1/sessions, also require
    commands_allowed and otherwise return 403 commands_not_allowed. Logout is
    DELETE /api/v1/sessions: it sets revoked_at and does not require
    commands_allowed. GET /api/v1/sessions/current returns the same user object
    without the token.

    Read-only dictionaries: GET /api/v1/rooms, /room-types, /buildings, and
    /room-statuses. Names are one string resolved from nx_label (see
    next/docs/adr-0002-nx-label.md and migration 0003_nx_label.sql). Room
    status codes are not translated by the server.

    GET /api/v1/rack returns rooms and stay blocks for a night window
    [from, to). to is exclusive. A stay occupies [arrival, departure).
    Canceled stays and canceled reservations are omitted.

    Reservations: GET /api/v1/reservations searches by dates, guest, status,
    and room. GET /api/v1/reservations/{id} is the detail. POST creates one
    stay. PATCH changes dates, room, guest, reservation status, or stay
    state. The server rejects overlapping stays (row lock on nx_room), illegal
    status changes, and a stale stay version. Writes require commands_allowed.
    Audit columns are migration 0004_nx_audit.sql. Folio routes are not
    implemented. nx_folio and nx_posting are schema only.

    Planned resources (rack, reservations, stays, folios, end of day, reports)
    are listed in docs/audit/03-celevaya-arhitektura.md §3.3.

    Realtime is a WebSocket hint, then an HTTP re-read. It does not replace
    this REST contract. The socket is served only when HOTEL_WS_LISTEN is set,
    on that address, path /api/v1/ws.
servers:
  - url: http://127.0.0.1:8080
    description: Default loopback bind (HOTEL_LISTEN).
tags:
  - name: meta
  - name: auth
  - name: dictionaries
  - name: rack
  - name: reservations
paths:
  /health:
    get:
      tags: [meta]
      operationId: getHealth
      summary: Process and optional database probe
      description: |
        200 when the process is up and either no database is configured or
        MariaDB answered. 503 when mysql_host and mysql_schema are set and
        the probe failed. Those keys come from hotel-api.ini beside the
        executable, or from /etc/hotel-api/hotel-api.ini on Linux. A
        non-empty HOTEL_CONFIG selects a different file. Non-empty
        HOTEL_MYSQL_HOST, HOTEL_MYSQL_PORT, HOTEL_MYSQL_SCHEMA,
        HOTEL_MYSQL_USER, and HOTEL_MYSQL_PASSWORD override the matching
        ini keys. The body does not contain the password, the host, the
        user, or the driver text. When the probe fails, db.error is a
        short code: driver_not_loaded, access_denied (MySQL 1045),
        unknown_database (1049), cannot_connect (2002 or 2003), or
        connection_failed. The server log has the native code and the
        scrubbed driver text. No database configured does not fail
        /health; POST /api/v1/sessions returns 503 database_not_configured
        in that case.
      responses:
        '200':
          description: Up. db.state is skipped or up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: A database is configured and the probe failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/v1:
    get:
      tags: [meta]
      operationId: getApiRoot
      summary: Contract marker
      security:
        - bearerAuth: []
      responses:
        '401':
          description: Bearer missing, unknown, expired, revoked, or the user is disabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: Service identity. No business data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiRoot'
  /api/v1/sessions:
    post:
      tags: [auth]
      operationId: createSession
      summary: Login and create a server-side session
      description: |
        Body is JSON with login (nx_user.login) and password (plaintext).
        Active users only (state = active) whose password_scheme is md5.
        Unknown user, disabled user, a non-md5 scheme, and a wrong password are
        all 401 with the same body. The password and the MD5 hash are not
        written to the log or the response. No configured database is 503
        database_not_configured. A refused MariaDB account is 503
        access_denied, a missing database is 503 unknown_database, and a
        failure to reach the port is 503 cannot_connect. Other connect
        failures stay 503 database_unavailable. The body does not include
        the driver text, host, user, or password. Missing nx_user or
        nx_session is 503 session_store_unavailable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session created. The token is shown once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          description: Body is not a JSON object with string login and password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Login failed. The body does not say which field was wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: |
            No database is configured, QMYSQL is missing, MariaDB refused
            the account (access_denied), the database is missing
            (unknown_database), the port could not be reached (cannot_connect),
            the connection failed for another reason (database_unavailable),
            or nx_user / nx_session are missing or the session row could not
            be stored. The body has no driver text and no password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [auth]
      operationId: deleteSession
      summary: Revoke the bearer session
      description: |
        Requires Authorization: Bearer. Sets nx_session.revoked_at to the
        database UTC time. Does not require commands_allowed. The token is
        not accepted again. A missing or already revoked token is 401
        unauthorized, the same as any other unknown token.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The row was revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResult'
        '401':
          description: Missing, malformed, unknown, revoked, expired, or disabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Database or session tables are unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/sessions/current:
    get:
      tags: [auth]
      operationId: getCurrentSession
      summary: Describe the bearer session
      description: |
        Same user object as login, plus commands_allowed and expires_at.
        The bearer token is not repeated. Requires a live session.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current session. No token field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentSession'
        '401':
          description: Missing, malformed, unknown, revoked, expired, or disabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Database or session tables are unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/reservations:
    get:
      tags: [reservations]
      operationId: listReservations
      summary: Search reservations for the signed-in property
      description: |
        Bearer required. `from` and `to` are optional and must be sent together
        (YYYY-MM-DD, `to` exclusive). A reservation matches when one of its stays
        overlaps that window. `guest` matches first or last name. `status` is
        the reservation status. `room` is the room code. `room_id` is numeric.
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          schema: {type: string, format: date}
        - name: to
          in: query
          schema: {type: string, format: date}
        - name: guest
          in: query
          schema: {type: string}
        - name: status
          in: query
          schema: {type: string}
        - name: room
          in: query
          schema: {type: string}
        - name: room_id
          in: query
          schema: {type: integer, format: int64}
      responses:
        '200':
          description: Matching reservations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationList'
        '400':
          description: invalid_request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Bearer missing or not accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [reservations]
      operationId: createReservation
      summary: Create one reservation and one stay
      description: |
        Requires commands_allowed. status_code is tentative, confirmed,
        guaranteed, or blocked (default confirmed). departure must be after
        arrival. The stay starts as reserved. Overlap with reserved, in_house,
        out_of_order, or out_of_inventory on the same room is 409 overlap.
        The room row is locked for the transaction.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationWrite'
      responses:
        '201':
          description: Created reservation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationDetail'
        '400':
          description: invalid_request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: commands_not_allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: room_not_found or guest_not_found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: overlap
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/reservations/{id}:
    get:
      tags: [reservations]
      operationId: getReservation
      summary: Reservation detail
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, format: int64}
      responses:
        '200':
          description: Reservation and stays.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationDetail'
        '404':
          description: reservation_not_found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags: [reservations]
      operationId: updateReservation
      summary: Change dates, room, guest, or status
      description: |
        Requires commands_allowed and the stay version. Reservation statuses
        are tentative, confirmed, guaranteed, blocked, and canceled. Stay
        states move reserved to in_house or canceled, in_house to checked_out,
        and canceled back to reserved when the reservation is reinstated.
        Check-in sets the room to occupied. Check-out sets it to vacant_dirty.
        Dates and room cannot change while the stay is in_house or checked_out.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, format: int64}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationPatch'
      responses:
        '200':
          description: Updated reservation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationDetail'
        '403':
          description: commands_not_allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: reservation_not_found, room_not_found, or guest_not_found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: overlap, invalid_transition, version_conflict, stay_in_house, or stay_locked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/rack:
    get:
      tags: [rack]
      operationId: getRack
      summary: Room occupancy for a night window
      description: |
        Bearer required. Query `from` and `to` are YYYY-MM-DD. The window is
        half-open: nights from `from` inclusive until `to` exclusive, at most
        120 nights. Each room of the signed-in property is returned. A block
        is a stay whose [arrival, departure) overlaps that window. Canceled
        stays and stays on a canceled reservation are omitted, as are stays
        with no room. guest_name is the primary stay guest, otherwise the
        first guest (last name, then first name). type_name follows nx_label
        the same way as GET /api/v1/rooms. state_code is not translated.
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
        - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: Rooms and overlapping stay blocks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RackChart'
        '400':
          description: invalid_range or range_too_long.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Bearer missing or not accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Database unavailable or schema_outdated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/rooms:
    get:
      tags: [dictionaries]
      operationId: listRooms
      summary: Rooms for the signed-in property
      description: |
        Bearer required. `lang` query or Accept-Language selects hy, en, or ru
        (default ru). Room type and building names come from nx_label, then ru,
        then the name column, then code. status_code is not translated.
        See next/docs/adr-0002-nx-label.md.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: Room rows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomList'
        '401':
          description: Bearer missing or not accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Database unavailable or nx_label / nx_room missing (schema_outdated).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/room-types:
    get:
      tags: [dictionaries]
      operationId: listRoomTypes
      summary: Room types for the signed-in property
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: Room types with one resolved name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NamedCodeList'
        '401':
          description: Bearer missing or not accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/buildings:
    get:
      tags: [dictionaries]
      operationId: listBuildings
      summary: Buildings for the signed-in property
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: Buildings with one resolved name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NamedCodeList'
        '401':
          description: Bearer missing or not accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/room-statuses:
    get:
      tags: [dictionaries]
      operationId: listRoomStatuses
      summary: Closed set of room status codes
      description: |
        Codes only. The client translates them. lang is echoed and does not
        change the body. Not stored in nx_label.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: Status codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeList'
        '401':
          description: Bearer missing or not accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/ws:
    get:
      tags: [meta]
      operationId: realtimeSocket
      summary: WebSocket hint channel (not HTTP)
      description: |
        Not an HTTP GET. Clients open a WebSocket to ws://<HOTEL_WS_LISTEN>/api/v1/ws.
        The first text frame is a hello object with events=not_implemented.
        PMS events are not published yet. Any other path on that listener is closed.
      x-websocket: true
      responses:
        '101':
          description: Switching Protocols when the WebSocket listener is enabled.
components:
  parameters:
    lang:
      name: lang
      in: query
      required: false
      schema:
        type: string
        enum: [hy, en, ru]
      description: |
        Preferred dictionary locale. Accept-Language is used when lang is
        omitted or not one of hy, en, ru. Otherwise the server uses ru.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        64 hex characters from POST /api/v1/sessions. The server stores SHA-256
        of this value in nx_session.token_hash.
  schemas:
    Health:
      type: object
      required: [status, service, version, db]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        service:
          type: string
          example: hotel-api
        version:
          type: string
          example: 0.7.0
        db:
          $ref: '#/components/schemas/DatabaseProbe'
    DatabaseProbe:
      type: object
      required: [configured, state]
      properties:
        configured:
          type: boolean
        state:
          type: string
          enum: [skipped, up, down]
        error:
          type: string
          description: |
            Present when state=down. A short code mapped from the MySQL native
            error number. Never a DSN, host, user, driver text, or password.
          enum:
            - driver_not_loaded
            - access_denied
            - unknown_database
            - cannot_connect
            - connection_failed
    ApiRoot:
      type: object
      required: [service, api, status, version]
      properties:
        service:
          type: string
        api:
          type: string
          example: v1
        status:
          type: string
          example: partial
        version:
          type: string
          example: 0.7.0
    LoginRequest:
      type: object
      required: [login, password]
      additionalProperties: true
      properties:
        login:
          type: string
          description: nx_user.login. utf8mb4_unicode_ci, so comparison is case-insensitive. Unique in the table.
        password:
          type: string
          format: password
          description: Plaintext. Compared as MD5 of the UTF-8 bytes when password_scheme is md5. Not stored and not logged.
    Session:
      type: object
      required: [token_type, token, expires_at, user, commands_allowed]
      properties:
        token_type:
          type: string
          enum: [Bearer]
        token:
          type: string
          description: 64 lowercase hex characters. Send it back on later calls. Not stored server-side.
          example: "00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff"
        expires_at:
          type: string
          format: date-time
          description: UTC, 12 hours after creation.
        user:
          $ref: '#/components/schemas/SessionUser'
        commands_allowed:
          type: boolean
          description: |
            False when role_id is null or nx_role_permission has no row for that role.
            Login still returns a token. Mutating routes reject that session with
            403 commands_not_allowed. Reading and logout do not.
    SessionUser:
      type: object
      required: [id, login, name, role_id, group]
      properties:
        id:
          type: integer
          format: int64
        login:
          type: string
        name:
          type: string
          description: first_name and last_name, trimmed. Not a secret.
        role_id:
          type: integer
          format: int64
          nullable: true
          description: nx_role.id. Null when the user has no role.
        group:
          type: integer
          format: int64
          nullable: true
          description: Same number as role_id. Present so a 0.2 client still sees the field.
    CurrentSession:
      type: object
      required: [token_type, expires_at, user, commands_allowed]
      properties:
        token_type:
          type: string
          enum: [Bearer]
        expires_at:
          type: string
          description: UTC, from nx_session.expires_at.
        user:
          $ref: '#/components/schemas/SessionUser'
        commands_allowed:
          type: boolean
    NamedCode:
      type: object
      required: [id, code, name]
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
        name:
          type: string
          description: Resolved for lang. Not three columns.
    NamedCodeList:
      type: object
      required: [lang, items]
      properties:
        lang:
          type: string
          enum: [hy, en, ru]
        items:
          type: array
          items:
            $ref: '#/components/schemas/NamedCode'
    CodeList:
      type: object
      required: [lang, items]
      properties:
        lang:
          type: string
        items:
          type: array
          items:
            type: object
            required: [code]
            properties:
              code:
                type: string
    ReservationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, status_code]
            properties:
              id: {type: integer, format: int64}
              status_code: {type: string}
              arrival: {type: string, format: date, nullable: true}
              departure: {type: string, format: date, nullable: true}
              guest_name: {type: string}
              room_code: {type: string, nullable: true}
              stay_state: {type: string, nullable: true}
              created_at: {type: string}
              updated_at: {type: string, nullable: true}
    ReservationDetail:
      type: object
      required: [id, status_code, stays]
      properties:
        id: {type: integer, format: int64}
        status_code: {type: string}
        remarks: {type: string, nullable: true}
        created_at: {type: string}
        created_by: {type: integer, format: int64, nullable: true}
        updated_at: {type: string, nullable: true}
        updated_by: {type: integer, format: int64, nullable: true}
        stays:
          type: array
          items:
            type: object
            required: [id, arrival, departure, state_code, version]
            properties:
              id: {type: integer, format: int64}
              room_id: {type: integer, format: int64, nullable: true}
              room_code: {type: string, nullable: true}
              arrival: {type: string, format: date}
              departure: {type: string, format: date}
              state_code: {type: string}
              adults: {type: integer}
              children: {type: integer}
              version: {type: integer}
              guest:
                nullable: true
                type: object
                properties:
                  id: {type: integer, format: int64}
                  first_name: {type: string}
                  last_name: {type: string}
    ReservationWrite:
      type: object
      required: [room_id, arrival, departure]
      properties:
        status_code: {type: string}
        room_id: {type: integer, format: int64}
        arrival: {type: string, format: date}
        departure: {type: string, format: date}
        adults: {type: integer}
        children: {type: integer}
        remarks: {type: string}
        guest_id: {type: integer, format: int64}
        guest:
          type: object
          required: [last_name]
          properties:
            first_name: {type: string}
            last_name: {type: string}
    ReservationPatch:
      type: object
      required: [version]
      properties:
        version: {type: integer}
        stay_id: {type: integer, format: int64}
        status_code: {type: string}
        state_code: {type: string}
        room_id: {type: integer, format: int64}
        arrival: {type: string, format: date}
        departure: {type: string, format: date}
        adults: {type: integer}
        children: {type: integer}
        remarks: {type: string}
        guest_id: {type: integer, format: int64}
        guest:
          type: object
          properties:
            first_name: {type: string}
            last_name: {type: string}
    RackChart:
      type: object
      required: [lang, from, to, rooms]
      properties:
        lang:
          type: string
        from:
          type: string
          format: date
        to:
          type: string
          format: date
          description: Exclusive end of the night window.
        rooms:
          type: array
          items:
            type: object
            required: [id, code, status_code, type_name, blocks]
            properties:
              id:
                type: integer
                format: int64
              code:
                type: string
              floor:
                type: integer
                nullable: true
              status_code:
                type: string
              type_name:
                type: string
              building_name:
                type: string
                nullable: true
              blocks:
                type: array
                items:
                  type: object
                  required: [stay_id, reservation_id, guest_name, state_code, reservation_status, arrival, departure]
                  properties:
                    stay_id:
                      type: integer
                      format: int64
                    reservation_id:
                      type: integer
                      format: int64
                    guest_name:
                      type: string
                    state_code:
                      type: string
                    reservation_status:
                      type: string
                    arrival:
                      type: string
                      format: date
                    departure:
                      type: string
                      format: date
                      description: Exclusive. The room is free on this date.
    RoomList:
      type: object
      required: [lang, items]
      properties:
        lang:
          type: string
        items:
          type: array
          items:
            type: object
            required: [id, code, status_code, room_type]
            properties:
              id:
                type: integer
                format: int64
              code:
                type: string
              floor:
                type: integer
                nullable: true
              phone:
                type: string
                nullable: true
              status_code:
                type: string
                description: Closed code. The client translates it.
              room_type:
                $ref: '#/components/schemas/NamedCode'
              building:
                nullable: true
                allOf:
                  - $ref: '#/components/schemas/NamedCode'
    LogoutResult:
      type: object
      required: [revoked]
      properties:
        revoked:
          type: boolean
          enum: [true]
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum:
            - invalid_request
            - unauthorized
            - session_expired
            - user_disabled
            - commands_not_allowed
            - database_not_configured
            - driver_not_loaded
            - access_denied
            - unknown_database
            - cannot_connect
            - database_unavailable
            - session_store_unavailable
            - schema_outdated
            - invalid_range
            - range_too_long
            - overlap
            - invalid_transition
            - version_conflict
            - stay_in_house
            - stay_locked
            - room_not_found
            - guest_not_found
            - reservation_not_found
            - not_found
        message:
          type: string
          description: Present for some errors. Never a password, hash, or DSN.
        path:
          type: string
