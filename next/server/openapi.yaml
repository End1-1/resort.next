openapi: 3.0.3
info:
  title: Hotel API
  version: 0.3.0
  description: |
    Qt/C++ service in next/server (Qt 6.10 target; the same sources also build
    on Qt 6.4). The engine choice overrides docs/audit/03 §3.2 (that note suggested Go).
    The store is the nx_ tables in next/dbdump/migrations/0002_nx_core.sql, not
    f_reservation / m_register. See next/docs/nx-schema.md.

    POST /api/v1/sessions reads nx_user. password_scheme must be md5. The service
    hashes the UTF-8 password with MD5 (32 lowercase hex) and compares it to
    password_hash. It does not send the password to MariaDB, does not read the
    legacy users table, and does not rewrite the hash. Apply 0002_nx_core.sql
    before login. Seed a user from next/dbdump/seed/nx_user.example.sql. The
    process does not create the tables itself.

    A successful login inserts nx_session. The response token is 64 hex
    characters. The database stores SHA-256 of that token, not the token. The
    row expires after 12 hours (UTC). commands_allowed is false when role_id is
    null or nx_role_permission has no row for that role. Login still succeeds.
    There is no command route yet; when one is added it must refuse that session.
    user.group repeats user.role_id.

    GET /health does not require a session. Reservation and folio routes are not
    implemented and return 404. nx_folio and nx_posting are schema only.

    Planned resources (rack, reservations, stays, folios, end of day, reports)
    are listed in docs/audit/03-celevaya-arhitektura.md §3.3.

    Realtime is a WebSocket hint, then an HTTP re-read. It does not replace
    this REST contract. The socket is served only when HOTEL_WS_LISTEN is set,
    on that address, path /api/v1/ws.
servers:
  - url: http://127.0.0.1:8080
    description: Default loopback bind (HOTEL_LISTEN).
tags:
  - name: meta
  - name: auth
paths:
  /health:
    get:
      tags: [meta]
      operationId: getHealth
      summary: Process and optional database probe
      description: |
        200 when the process is up and either no database is configured or
        MariaDB answered. 503 when mysql_host and mysql_schema are set and
        the probe failed. Those keys come from hotel-api.ini beside the
        executable, or from /etc/hotel-api/hotel-api.ini on Linux. A
        non-empty HOTEL_CONFIG selects a different file. Non-empty
        HOTEL_MYSQL_HOST, HOTEL_MYSQL_PORT, HOTEL_MYSQL_SCHEMA,
        HOTEL_MYSQL_USER, HOTEL_MYSQL_PASSWORD, HOTEL_MYSQL_SSL, and
        HOTEL_MYSQL_SSL_CA override the matching ini keys. The body does not contain the password, the host, the
        user, or the driver text. When the probe fails, db.error is a
        short code: driver_not_loaded, access_denied (MySQL 1045),
        unknown_database (1049), cannot_connect (2002 or 2003),
        tls_error (2026), or connection_failed. The server log has the native code and the
        scrubbed driver text. No database configured does not fail
        /health; POST /api/v1/sessions returns 503 database_not_configured
        in that case.
      responses:
        '200':
          description: Up. db.state is skipped or up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: A database is configured and the probe failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/v1:
    get:
      tags: [meta]
      operationId: getApiRoot
      summary: Contract marker
      responses:
        '200':
          description: Service identity. No business data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiRoot'
  /api/v1/sessions:
    post:
      tags: [auth]
      operationId: createSession
      summary: Login and create a server-side session
      description: |
        Body is JSON with login (nx_user.login) and password (plaintext).
        Active users only (state = active) whose password_scheme is md5.
        Unknown user, disabled user, a non-md5 scheme, and a wrong password are
        all 401 with the same body. The password and the MD5 hash are not
        written to the log or the response. No configured database is 503
        database_not_configured. A refused MariaDB account is 503
        access_denied, a missing database is 503 unknown_database, and a
            failure to reach the port is 503 cannot_connect. A TLS failure
            is 503 tls_error. Other connect
        failures stay 503 database_unavailable. The body does not include
        the driver text, host, user, or password. Missing nx_user or
        nx_session is 503 session_store_unavailable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session created. The token is shown once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          description: Body is not a JSON object with string login and password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Login failed. The body does not say which field was wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: |
            No database is configured, QMYSQL is missing, MariaDB refused
            the account (access_denied), the database is missing
            (unknown_database), the port could not be reached (cannot_connect),
            the connection failed for another reason (database_unavailable),
            or nx_user / nx_session are missing or the session row could not
            be stored. The body has no driver text and no password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/ws:
    get:
      tags: [meta]
      operationId: realtimeSocket
      summary: WebSocket hint channel (not HTTP)
      description: |
        Not an HTTP GET. Clients open a WebSocket to ws://<HOTEL_WS_LISTEN>/api/v1/ws.
        The first text frame is a hello object with events=not_implemented.
        PMS events are not published yet. Any other path on that listener is closed.
      x-websocket: true
      responses:
        '101':
          description: Switching Protocols when the WebSocket listener is enabled.
components:
  schemas:
    Health:
      type: object
      required: [status, service, version, db]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        service:
          type: string
          example: hotel-api
        version:
          type: string
          example: 0.3.0
        db:
          $ref: '#/components/schemas/DatabaseProbe'
    DatabaseProbe:
      type: object
      required: [configured, state]
      properties:
        configured:
          type: boolean
        state:
          type: string
          enum: [skipped, up, down]
        error:
          type: string
          description: |
            Present when state=down. A short code mapped from the MySQL native
            error number. Never a DSN, host, user, driver text, or password.
          enum:
            - driver_not_loaded
            - access_denied
            - unknown_database
            - cannot_connect
            - tls_error
            - connection_failed
    ApiRoot:
      type: object
      required: [service, api, status, version]
      properties:
        service:
          type: string
        api:
          type: string
          example: v1
        status:
          type: string
          example: partial
        version:
          type: string
          example: 0.3.0
    LoginRequest:
      type: object
      required: [login, password]
      additionalProperties: true
      properties:
        login:
          type: string
          description: nx_user.login. utf8mb4_unicode_ci, so comparison is case-insensitive. Unique in the table.
        password:
          type: string
          format: password
          description: Plaintext. Compared as MD5 of the UTF-8 bytes when password_scheme is md5. Not stored and not logged.
    Session:
      type: object
      required: [token_type, token, expires_at, user, commands_allowed]
      properties:
        token_type:
          type: string
          enum: [Bearer]
        token:
          type: string
          description: 64 lowercase hex characters. Send it back on later calls. Not stored server-side.
          example: "00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff"
        expires_at:
          type: string
          format: date-time
          description: UTC, 12 hours after creation.
        user:
          $ref: '#/components/schemas/SessionUser'
        commands_allowed:
          type: boolean
          description: |
            False when role_id is null or nx_role_permission has no row for that role.
            Login still returns a token. Future command routes must reject it.
    SessionUser:
      type: object
      required: [id, login, name, role_id, group]
      properties:
        id:
          type: integer
          format: int64
        login:
          type: string
        name:
          type: string
          description: first_name and last_name, trimmed. Not a secret.
        role_id:
          type: integer
          format: int64
          nullable: true
          description: nx_role.id. Null when the user has no role.
        group:
          type: integer
          format: int64
          nullable: true
          description: Same number as role_id. Present so a 0.2 client still sees the field.
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum:
            - invalid_request
            - unauthorized
            - database_not_configured
            - driver_not_loaded
            - access_denied
            - unknown_database
            - cannot_connect
            - tls_error
            - database_unavailable
            - session_store_unavailable
            - not_found
        message:
          type: string
          description: Present for some errors. Never a password, hash, or DSN.
        path:
          type: string
